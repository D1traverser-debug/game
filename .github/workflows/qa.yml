name: Browser game integrity and regression
on:
  push:
    branches: [development, main, full-game]
  pull_request:
    branches: [main, full-game]
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser source
        run: python scripts/package_web.py --check
      - name: Verify browser scope and artifact checkpoint
        run: python scripts/verify_project_state.py
      - name: Run positive and negative controls
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  web-package:
    runs-on: ubuntu-latest
    needs: checkpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package static browser preview
        run: python scripts/package_web.py
      - name: Verify byte-identical package and manifest
        run: python scripts/package_web.py --verify-output
      - uses: actions/upload-artifact@v4
        with:
          name: aetherwilds-browser-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser-component:
    strategy:
      fail-fast: false
      matrix:
        test: [progression_regression, normal_play_smoke, objective_collection_regression, character_upgrade_regression]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser regression
        run: python tests/${{ matrix.test }}.py

  browser-content-visual:
    strategy:
      fail-fast: false
      matrix:
        test: [game3d_integration, trial_unlock_regression, art_renderer_regression, reginald_spell_scope_regression, boss_encounter_regression]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser regression
        run: python tests/${{ matrix.test }}.py

# CI proves only the listed automated checks. It does not prove full-game completion,
# online co-op, commercial-quality assets, physical-device performance or player acceptance.
