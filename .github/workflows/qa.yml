name: Game repository integrity and regression
on:
  push:
    branches: [development, main, full-game]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify single-file build reproducibility
        run: python scripts/build_game.py --check
      - name: Verify full-game scope and legacy artifact checkpoint
        run: python scripts/verify_project_state.py
      - name: Run positive and negative checkpoint controls
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser-component:
    strategy:
      fail-fast: false
      matrix:
        test:
          - progression_regression
          - normal_play_smoke
          - objective_collection_regression
          - character_upgrade_regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run ${{ matrix.test }}
        run: python tests/${{ matrix.test }}.py

  browser-content-visual:
    strategy:
      fail-fast: false
      matrix:
        test:
          - game3d_integration
          - trial_unlock_regression
          - art_renderer_regression
          - reginald_spell_scope_regression
          - boss_encounter_regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run ${{ matrix.test }}
        run: python tests/${{ matrix.test }}.py

  core-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build engine-independent simulation core
        run: dotnet build src/core/Game.Core.csproj --configuration Release
      - name: Run deterministic core contracts
        run: dotnet run --project tests/core/Game.Core.Tests.csproj --configuration Release

# Blocking CI is limited to deterministic contracts and bounded browser regressions.
# Long-horizon heuristic play is exploratory telemetry, not a human acceptance test.
