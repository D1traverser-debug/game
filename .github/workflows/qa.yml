name: Game repository integrity and regression
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owner scope and exact artifact checkpoint
        run: python scripts/verify_project_state.py
      - name: Run positive and negative checkpoint controls
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser progression integration regression
        run: python tests/progression_regression.py
      - name: Browser normal-play 90-second combat smoke
        run: python tests/normal_play_smoke.py
      - name: Browser objective collection regression
        run: python tests/objective_collection_regression.py
      - name: Browser character upgrade regression
        run: python tests/character_upgrade_regression.py
      - name: Browser full mission natural boss victory attempt
        run: python tests/full_mission_natural_run.py
      - name: Browser 3D combat, boss and objectives integration
        run: python tests/game3d_integration.py
      - name: Browser solo spell trials and quest persistence regression
        run: python tests/trial_unlock_regression.py
      - name: Browser atlas-backed 2.5D renderer regression
        run: python tests/art_renderer_regression.py
      - name: Browser Reginald-only spell pool and migration regression
        run: python tests/reginald_spell_scope_regression.py

# CI is a mechanical + browser component gate, NOT a full player acceptance gate.
